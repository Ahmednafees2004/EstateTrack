<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>EstateTrack Registration</title></head>
<body>
<h2>Register for EstateTrack</h2>
<form action="/register" method="POST">
<label for="username">Username</label><br><input id="username" name="username" required><br><br>
<label for="email">Email</label><br><input type="email" id="email" name="email" required><br><br>
<label for="password">Password</label><br><input type="password" id="password" name="password" required><br><br>
<button type="submit">Register</button>
</form>
<p>Already registered? <a href="login.html">Login here</a></p>
</body></html>
